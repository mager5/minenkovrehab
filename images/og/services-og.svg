<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="servicesBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для акцентов -->
    <linearGradient id="servicesAccentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для иконок -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Основной фон -->
  <rect width="1200" height="630" fill="url(#servicesBgGradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="1050" cy="100" r="50" fill="rgba(6,182,212,0.1)"/>
  <circle cx="150" cy="500" r="30" fill="rgba(16,185,129,0.2)"/>
  <circle cx="1100" cy="450" r="40" fill="rgba(6,182,212,0.1)"/>
  
  <!-- Иконки услуг -->
  <!-- Консультация -->
  <g transform="translate(900, 150)">
    <circle cx="25" cy="25" r="25" fill="rgba(6,182,212,0.2)" stroke="url(#servicesAccentGradient)" stroke-width="2"/>
    <path d="M15 20 Q15 15 25 15 Q35 15 35 20 L35 30 Q35 35 30 35 L20 35 Q15 35 15 30 Z" fill="url(#iconGradient)"/>
    <circle cx="25" cy="12" r="5" fill="url(#iconGradient)"/>
  </g>
  
  <!-- Программа -->
  <g transform="translate(950, 200)">
    <rect x="5" y="5" width="40" height="30" rx="3" fill="rgba(6,182,212,0.2)" stroke="url(#servicesAccentGradient)" stroke-width="2"/>
    <rect x="10" y="12" width="30" height="2" fill="url(#iconGradient)"/>
    <rect x="10" y="18" width="20" height="2" fill="url(#iconGradient)"/>
    <rect x="10" y="24" width="25" height="2" fill="url(#iconGradient)"/>
  </g>
  
  <!-- Тренировки -->
  <g transform="translate(900, 250)">
    <circle cx="25" cy="25" r="25" fill="rgba(6,182,212,0.2)" stroke="url(#servicesAccentGradient)" stroke-width="2"/>
    <path d="M15 25 L20 20 L25 25 L30 20 L35 25" stroke="url(#iconGradient)" stroke-width="3" fill="none"/>
    <circle cx="20" cy="20" r="2" fill="url(#iconGradient)"/>
    <circle cx="30" cy="20" r="2" fill="url(#iconGradient)"/>
  </g>
  
  <!-- Реабилитация -->
  <g transform="translate(950, 300)">
    <rect x="10" y="10" width="30" height="30" rx="15" fill="rgba(6,182,212,0.2)" stroke="url(#servicesAccentGradient)" stroke-width="2"/>
    <path d="M20 18 L20 32 M14 25 L26 25" stroke="url(#iconGradient)" stroke-width="3"/>
  </g>
  
  <!-- Основной текст -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    Услуги
  </text>
  
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)">
    Выберите подходящую услугу
  </text>
  <text x="100" y="280" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)">
    для восстановления и реабилитации
  </text>
  
  <!-- Список услуг -->
  <g transform="translate(100, 320)">
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="22" fill="url(#servicesAccentGradient)" font-weight="600">
      • Онлайн-консультация
    </text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="22" fill="url(#servicesAccentGradient)" font-weight="600">
      • Персональная программа
    </text>
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="22" fill="url(#servicesAccentGradient)" font-weight="600">
      • Программа "Формула Движения"
    </text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="22" fill="url(#servicesAccentGradient)" font-weight="600">
      • Восстановительные программы
    </text>
  </g>
  
  <!-- Логотип/бренд внизу -->
  <text x="100" y="580" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)">
    minenkovrehab.ru
  </text>
  
  <!-- Декоративная линия -->
  <rect x="100" y="300" width="120" height="3" fill="url(#servicesAccentGradient)" rx="1.5"/>
</svg>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Градиент для акцентов -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Основной фон -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Декоративные элементы -->
  <circle cx="100" cy="100" r="40" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="60" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1050" cy="150" r="30" fill="rgba(16,185,129,0.3)"/>
  
  <!-- Медицинский крест -->
  <g transform="translate(950, 80)">
    <rect x="15" y="5" width="10" height="30" fill="url(#accentGradient)" rx="2"/>
    <rect x="5" y="15" width="30" height="10" fill="url(#accentGradient)" rx="2"/>
  </g>
  
  <!-- Иконка человека -->
  <g transform="translate(80, 450)">
    <circle cx="20" cy="15" r="12" fill="rgba(255,255,255,0.8)"/>
    <path d="M8 35 Q8 25 20 25 Q32 25 32 35 L32 50 Q32 55 27 55 L13 55 Q8 55 8 50 Z" fill="rgba(255,255,255,0.8)"/>
  </g>
  
  <!-- Основной текст -->
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white">
    Обо мне
  </text>
  
  <text x="100" y="260" font-family="Arial, sans-serif" font-size="36" fill="rgba(255,255,255,0.9)">
    Физический реабилитолог
  </text>
  
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="url(#accentGradient)">
    Вадим Миненков
  </text>
  
  <!-- Описание -->
  <text x="100" y="370" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">
    Специалист по спортивной тренировке
  </text>
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">
    и физической реабилитации
  </text>
  
  <!-- Логотип/бренд внизу -->
  <text x="100" y="580" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)">
    minenkovrehab.ru
  </text>
  
  <!-- Декоративная линия -->
  <rect x="100" y="330" width="80" height="3" fill="url(#accentGradient)" rx="1.5"/>
</svg>
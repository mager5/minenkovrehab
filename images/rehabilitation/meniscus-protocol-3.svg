<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Заголовок -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7c3aed">
    Этап 3: Функциональное восстановление (6-12 недель)
  </text>
  
  <!-- Колено схематично -->
  <g transform="translate(150, 60)">
    <!-- Бедренная кость -->
    <rect x="40" y="0" width="20" height="80" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    
    <!-- Большеберцовая кость -->
    <rect x="40" y="120" width="20" height="80" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    
    <!-- Коленный сустав -->
    <circle cx="50" cy="100" r="25" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    
    <!-- Восстановленный мениск -->
    <path d="M 35 95 Q 50 85 65 95 Q 50 105 35 95" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
    
    <!-- Здоровые ткани -->
    <circle cx="45" cy="92" r="1" fill="#059669" opacity="0.8"/>
    <circle cx="55" cy="98" r="1" fill="#059669" opacity="0.8"/>
    <circle cx="50" cy="105" r="1" fill="#059669" opacity="0.8"/>
  </g>
  
  <!-- Активные упражнения -->
  <g transform="translate(250, 70)">
    <!-- Человечек в движении -->
    <circle cx="15" cy="10" r="8" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <line x1="15" y1="18" x2="15" y2="50" stroke="#92400e" stroke-width="3"/>
    <line x1="15" y1="30" x2="0" y2="35" stroke="#92400e" stroke-width="2"/>
    <line x1="15" y1="30" x2="30" y2="35" stroke="#92400e" stroke-width="2"/>
    <line x1="15" y1="50" x2="0" y2="70" stroke="#92400e" stroke-width="2"/>
    <line x1="15" y1="50" x2="30" y2="70" stroke="#92400e" stroke-width="2"/>
    
    <!-- Гантели -->
    <rect x="-5" y="32" width="8" height="3" fill="#374151"/>
    <rect x="27" y="32" width="8" height="3" fill="#374151"/>
    
    <!-- Стрелки активности -->
    <path d="M 40 30 L 45 25 L 40 20" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <path d="M 40 50 L 45 55 L 40 60" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <path d="M 40 40 L 45 40" stroke="#7c3aed" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Рекомендации -->
  <g transform="translate(20, 180)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#374151">
      Основные задачи:
    </text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
      • Силовые упражнения
    </text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
      • Функциональная тренировка
    </text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
      • Проприоцептивные упражнения
    </text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
      • Подготовка к спорту
    </text>
  </g>
  
  <!-- Иконка силовых упражнений -->
  <g transform="translate(320, 180)">
    <rect x="0" y="10" width="30" height="40" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="10" y="20" width="10" height="3" fill="#374151"/>
    <circle cx="8" cy="21" r="2" fill="#374151"/>
    <circle cx="22" cy="21" r="2" fill="#374151"/>
    <line x1="15" y1="25" x2="15" y2="35" stroke="#7c3aed" stroke-width="2"/>
    <line x1="10" y1="30" x2="20" y2="30" stroke="#7c3aed" stroke-width="1"/>
    <text x="15" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
      Силовые
    </text>
  </g>
</svg>
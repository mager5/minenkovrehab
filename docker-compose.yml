# Timeweb App Platform: pull prepared linux/amd64 images; no server builds or SQL.
# Image references are supplied after approved publication, preferably @sha256.
# No build fallback: missing/inaccessible images must fail before starting services.
x-private: &private
  MIGRATION_ENV: private
  MIGRATION_PRIVATE_CONFIRM: Friendly-Halimede-default_db-gen_user
  MIGRATION_PG_TLS: disabled-private
  MIGRATION_SITE_ORIGIN: ${MIGRATION_SITE_ORIGIN:?platform HTTPS origin required}
  MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?gen_user private URL required}
  MIGRATION_DB_READY_CONFIRM: ${MIGRATION_DB_READY_CONFIRM:-}
  MIGRATION_RESET_KEY: ${MIGRATION_RESET_KEY:?private key required}
  # Waiting boot does not use payment handlers; active loadConfig requires the key.
  STAGE1_TEST_PASSWORD2: ${STAGE1_TEST_PASSWORD2:-}
services:
  frontend:
    image: ${FRONTEND_IMAGE:?published linux/amd64 image digest required}
    platform: linux/amd64
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.50"
    ports: ['3000:3000']
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      MIGRATION_ENV: private
      MIGRATION_SITE_ORIGIN: ${MIGRATION_SITE_ORIGIN:?platform HTTPS origin required}
      MIGRATION_API_INTERNAL_URL: http://backend:3101
    restart: unless-stopped
    init: true
  backend:
    image: ${API_IMAGE:?published linux/amd64 image digest required}
    platform: linux/amd64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.25"
    command: [node, timeweb/private-boot.js, api]
    expose: ['3101']
    environment:
      <<: *private
      MIGRATION_VIDEO_PROVIDER: disabled
      STAGE1_PORT: '3101'
    restart: unless-stopped
    init: true
  worker:
    image: ${WORKER_IMAGE:?published linux/amd64 image digest required}
    platform: linux/amd64
    mem_limit: 96m
    memswap_limit: 96m
    cpus: "0.25"
    command: [node, timeweb/private-boot.js, worker]
    expose: ['3102']
    environment:
      <<: *private
      MIGRATION_MAIL_PROVIDER: test
      MIGRATION_MAIL_NETWORK_ENABLED: 'false'
      MIGRATION_WORKER_PORT: '3102'
    restart: unless-stopped
    init: true

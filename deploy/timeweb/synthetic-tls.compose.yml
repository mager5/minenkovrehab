# App Platform: frontend MUST be the first service (the only public proxy).
# No .env files, host networking, external networks, volumes or real providers.
x-runtime: &runtime
  MIGRATION_ENV: staging
  MIGRATION_STAGING_CONFIRM: synthetic-rehab-staging
  MIGRATION_SITE_ORIGIN: ${MIGRATION_SITE_ORIGIN:?isolated HTTPS origin required}
  MIGRATION_RESET_KEY: ${MIGRATION_RESET_KEY:?private synthetic encryption key required}
  STAGE1_TEST_PASSWORD2: ${STAGE1_TEST_PASSWORD2:?synthetic ResultURL key required}
  MIGRATION_PG_TLS: verify-full
  MIGRATION_PG_CA: ${MIGRATION_PG_CA:?verified database CA required}
services:
  frontend:
    build:
      context: .
      dockerfile: deploy/timeweb/frontend.Dockerfile
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      MIGRATION_ENV: staging
      MIGRATION_SITE_ORIGIN: ${MIGRATION_SITE_ORIGIN:?isolated HTTPS origin required}
      MIGRATION_API_INTERNAL_URL: http://backend:3101
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      backend: {condition: service_started}
  backend:
    build:
      context: .
      dockerfile: deploy/timeweb/backend.Dockerfile
    expose: ["3101"]
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?rehab_payment URL required}
      MIGRATION_AUTH_DATABASE_URL: ${MIGRATION_AUTH_DATABASE_URL:?rehab_auth URL required}
      MIGRATION_VIDEO_PROVIDER: disabled
      STAGE1_PORT: '3101'
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build:
      context: .
      dockerfile: deploy/timeweb/worker.Dockerfile
    expose: ["3102"]
    environment:
      <<: *runtime
      # Target contains no payment credentials; only used to validate host/db.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_TARGET:?passwordless rehab_payment target required}
      MIGRATION_WORKER_DATABASE_URL: ${MIGRATION_WORKER_DATABASE_URL:?rehab_worker URL required}
      MIGRATION_MAIL_PROVIDER: test
      MIGRATION_MAIL_NETWORK_ENABLED: 'false'
      MIGRATION_WORKER_PORT: '3102'
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      migrate: {condition: service_completed_successfully}
  migrate:
    build:
      context: .
      dockerfile: deploy/timeweb/backend.Dockerfile
    command: [node, timeweb/migrate.js, --grants, --synthetic-seed]
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_TARGET:?passwordless rehab_payment target required}
      MIGRATION_MIGRATOR_DATABASE_URL: ${MIGRATION_MIGRATOR_DATABASE_URL:?dedicated schema owner required}
      MIGRATION_MIGRATION_CONFIRM: isolated-rehab-schema
      MIGRATION_SYNTHETIC_PASSWORD: ${MIGRATION_SYNTHETIC_PASSWORD:?artificial account password required}
    restart: 'no'
    init: true
    healthcheck: {disable: true}

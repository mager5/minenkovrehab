x-backend: &backend
  image: rehab-backend:staging
  build:
    context: ../..
    dockerfile: deploy/timeweb/backend.Dockerfile
  env_file: /etc/rehab/backend.env
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  read_only: true
  tmpfs: [/tmp]
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3101/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 3
services:
  backend:
    <<: *backend
    expose: [3101]
  worker:
    <<: *backend
    command: [node, timeweb/queue-worker.js]
    env_file: /etc/rehab/worker.env
    expose: [3102]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3102/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    image: rehab-frontend:staging
    build:
      context: ../..
      dockerfile: deploy/timeweb/frontend.Dockerfile
    env_file: /etc/rehab/frontend.env
    restart: unless-stopped
    init: true
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  migrate:
    <<: *backend
    profiles: [tools]
    restart: 'no'
    env_file: /etc/rehab/migrator.env
    command: [node, timeweb/migrate.js]
    healthcheck: {disable: true}
